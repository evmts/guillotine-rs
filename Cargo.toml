[package]
name = "guillotine-rs"
version = "0.1.4"
edition = "2021"
links = "guillotine_mini"
rust-version = "1.91"
authors = ["EVMts Contributors"]
license = "MIT OR Apache-2.0"
description = "High-performance REVM-compatible EVM execution backed by Zig's guillotine-mini engine with FFI integration"
repository = "https://github.com/evmts/guillotine-rs"
documentation = "https://docs.rs/guillotine-rs"
homepage = "https://github.com/evmts/guillotine-rs"
readme = "README.md"
keywords = ["evm", "ethereum", "revm", "blockchain", "virtual-machine"]
categories = ["cryptography::cryptocurrencies", "development-tools"]
include = ["/src", "/tests", "/benches", "/vendor", "/build.rs", "/build.zig", "/README.md", "/PUBLISHING.md", "/LICENSE-*"]

[dependencies]
ark-bls12-381 = "0.5"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
# The Zig build uses headers from this exact c-kzg release.
c-kzg = "=2.1.8"
keccak-asm = "0.1"
revm = "30.2"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.9"

[[bench]]
name = "transaction"
harness = false
